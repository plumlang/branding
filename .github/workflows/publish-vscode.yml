# Publishes the VS Code extension through the shared Elixpo workflow. It
# publishes only when package.json's version is newer than the Marketplace's,
# so a merge that doesn't bump the version does nothing.
# Needs a GitHub environment named "vscode" holding the VSCE_PAT secret.
name: Publish VS Code extension

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/publish-vscode.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  vscode:
    uses: elixpo/agent.elixpo/.github/workflows/publish-vscode.yml@main
    with:
      working-directory: .
      build-command: npm run compile
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
